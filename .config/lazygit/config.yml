gui:
  screenMode: half
  showFileTree: false
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#ff9e64"
      - "bold"
    inactiveBorderColor:
      - "#27a1b9"
    searchingActiveBorderColor:
      - "#ff9e64"
      - "bold"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitFgColor:
      - "#7aa2f7"
    cherryPickedCommitBgColor:
      - "#bb9af7"
    markedBaseCommitFgColor:
      - "#7aa2f7"
    markedBaseCommitBgColor:
      - "#e0af68"
    unstagedChangesColor:
      - "#db4b4b"
    defaultFgColor:
      - "#c0caf5"
promptToReturnFromSubprocess: false
keybinding:
  universal:
    quit: q
    quit-alt1: <disabled>
    return: <c-c>
    edit: E
customCommands:
  - key: 'e'
    context: 'files'
    description: 'Edit in parent Neovim'
    command: >-
      test -n "$NVIM" &&
      nvim --server "$NVIM" --remote-expr 'luaeval("(function() vim.g.lazygit_terminal_buf = vim.api.nvim_get_current_buf(); local best, best_col, best_row; for _, w in ipairs(vim.api.nvim_list_wins()) do local c = vim.api.nvim_win_get_config(w); if c.relative == \"\" then local p = vim.api.nvim_win_get_position(w); if not best_col or p[2] < best_col or (p[2] == best_col and p[1] < best_row) then best, best_col, best_row = w, p[2], p[1] end end end; if best then vim.api.nvim_set_current_win(best); vim.g.lazygit_target_win = best end end)()")' &&
      nvim --server "$NVIM" --remote "$PWD"/{{.SelectedFile.Name | quote}} &&
      nvim --server "$NVIM" --remote-expr 'luaeval("(function() local b = vim.g.lazygit_terminal_buf; if b and vim.api.nvim_buf_is_valid(b) then local job = vim.b[b].terminal_job_id; if job then vim.api.nvim_chan_send(job, \"q\") end end end)()")'
    output: none
